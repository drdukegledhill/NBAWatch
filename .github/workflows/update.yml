name: Update data

on:
  schedule:
    # Every 3 hours; games finish late US time, so this keeps the dashboard within a few hours.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start day (YYYY-MM-DD, US Eastern). Leave empty for the normal rolling window."
        required: false
      to:
        description: "Backfill end day (defaults to today)"
        required: false
      days:
        description: "Rolling window in days when 'from' is empty"
        required: false
        default: "3"
      sources:
        description: "Comma-separated: espn,apisports,reddit"
        required: false
        default: "espn,apisports,reddit"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/*.test.mjs"
      - name: Fetch, merge and score
        env:
          NBAWATCH_API_KEY: ${{ secrets.NBAWATCH_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          DAYS: ${{ inputs.days || '3' }}
          SOURCES: ${{ inputs.sources || 'espn,apisports,reddit' }}
        run: |
          args=(--sources "$SOURCES" --days "$DAYS")
          if [ -n "$FROM" ]; then args+=(--from "$FROM"); fi
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          node scripts/update.mjs "${args[@]}"
      # Runs even if the fetch step timed out or failed, so long backfills keep their progress.
      - name: Commit data
        if: always()
        run: |
          git config user.name "nbawatch-bot"
          git config user.email "nbawatch-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
